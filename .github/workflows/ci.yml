name: CI

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_call: {} # lets release.yml re-run this same suite before tagging

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the global gorun.exe onto PATH
        run: go install ./cmd/gorun
        shell: cmd

      - name: gorun setup in a scratch project
        run: |
          mkdir scratch
          cd scratch
          go mod init scratch
          gorun setup --yes --mysql-host 127.0.0.1 --mysql-user root --mysql-database scratch
        shell: cmd

      - name: gorun.bat exists and runs explicitly
        run: |
          if not exist scratch\gorun.bat (echo gorun.bat was not scaffolded & exit /b 1)
          cd scratch
          .\gorun.bat help
        shell: cmd

      - name: bare `gorun` in cmd.exe resolves to the local gorun.bat
        run: |
          cd scratch
          for /f "delims=" %%i in ('where gorun') do (
            echo First match: %%i
            echo %%i | findstr /c:"scratch" >nul
            if errorlevel 1 (
              echo Expected cmd.exe to resolve bare 'gorun' to scratch\gorun.bat, got: %%i
              exit /b 1
            )
            goto :cmddone
          )
          :cmddone
          gorun help
        shell: cmd

      - name: bare `gorun` in PowerShell resolves to the global gorun.exe, not the local gorun.bat
        run: |
          cd scratch
          $match = Get-Command gorun -All | Select-Object -First 1
          Write-Host "First match: $($match.Source)"
          if ($match.Source -like "*scratch*") {
            Write-Error "Expected PowerShell to resolve bare 'gorun' to the global gorun.exe, got: $($match.Source)"
            exit 1
          }
          gorun help
        shell: pwsh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # .golangci.yml uses the v2 config schema - the action needs to
          # be v7+ to support golangci-lint v2 at all (v6 only understood
          # v1 config/binaries), and the golangci-lint version itself
          # pinned explicitly rather than "latest" so CI and local runs
          # agree on behavior.
          version: v2.12.2
