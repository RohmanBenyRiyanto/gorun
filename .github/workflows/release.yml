name: Release

# Runs when release lands on the `release` branch (see CONTRIBUTING.md):
# re-verifies CI, bumps and pushes a semver tag, cuts a GitHub Release, and
# attaches cross-compiled `gorun` binaries to it.
on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  tag:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump and push tag
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: "true"
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: release
          MAJOR_STRING_TOKEN: "#major"
          MINOR_STRING_TOKEN: "#minor"
          PATCH_STRING_TOKEN: "#patch"

  build:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build gorun binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          out="gorun_${{ needs.tag.outputs.new_tag }}_${{ matrix.os }}_${{ matrix.arch }}${ext}"
          go build -ldflags "-X github.com/RohmanBenyRiyanto/gorun/internal/version.version=${{ needs.tag.outputs.new_tag }}" -o "dist/${out}" ./cmd/gorun
          echo "ASSET_PATH=dist/${out}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: gorun_${{ matrix.os }}_${{ matrix.arch }}
          path: ${{ env.ASSET_PATH }}

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          generate_release_notes: true
          files: dist/*
