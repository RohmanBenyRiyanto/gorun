version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - nilerr
    - errorlint
    - copyloopvar
    - gosec
    - revive
    - gocritic
    - unconvert
    - unparam
    - misspell
    - goconst
    - prealloc

  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G104
        - G204
        - G304
        - G301
        - G306
        - G702
    goconst:
      min-occurrences: 7
    revive:
      rules:
        - name: exported
          disabled: true
    gocritic:
      disabled-checks:
        - ifElseChain

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
