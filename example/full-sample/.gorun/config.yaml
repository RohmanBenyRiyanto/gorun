name: "gorun-sample"
usage: "gorun full sample - blog-ish demo"
app_env: "local"
runner_path: "./cmd/gorun-runner"

mysql:
  host: "127.0.0.1"
  port: "3306"
  user: "root"
  password: "${DB_PASSWORD}"
  database_name: "gorun_sample"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: "5m"
  migration_path: "database/migrations"
  seeder_path: "database/seeders"
